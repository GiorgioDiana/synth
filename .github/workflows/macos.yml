name: macOS plugins
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Identify Apple toolchain
        id: toolchain
        run: echo "key=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: binaries
        with:
          key: sixth-macos15-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('CMakeLists.txt', 'Source/**', 'Tests/**') }}
          path: |
            build/Sixth_artefacts/Release/AU
            build/Sixth_artefacts/Release/VST3
            build/Sixth_artefacts/Release/Standalone
            build/SynthTests_artefacts/Release/SynthTests
      - name: Configure universal AU and VST3
        if: steps.binaries.outputs.cache-hit != 'true'
        run: bash scripts/ci-check.sh 'Configure universal AU and VST3' cmake -S . -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        if: steps.binaries.outputs.cache-hit != 'true'
        run: bash scripts/ci-check.sh 'Build macOS binaries' cmake --build build --config Release --parallel 4
      - name: Retain compiled binaries before validation
        if: steps.binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.binaries.outputs.cache-primary-key }}
          path: |
            build/Sixth_artefacts/Release/AU
            build/Sixth_artefacts/Release/VST3
            build/Sixth_artefacts/Release/Standalone
            build/SynthTests_artefacts/Release/SynthTests
      - name: Verify universal binaries and sign for local testing
        shell: bash
        run: |
          set -euo pipefail
          for bundle in build/Sixth_artefacts/Release/{AU/Sixth.component,VST3/Sixth.vst3,Standalone/Sixth.app}; do
            bash scripts/ci-check.sh "$bundle architectures" lipo "$bundle/Contents/MacOS/Sixth" -archs
            bash scripts/ci-check.sh "$bundle universal verification" lipo "$bundle/Contents/MacOS/Sixth" -verify_arch arm64 x86_64
            bash scripts/ci-check.sh "$bundle signing" codesign --force --deep --sign - "$bundle"
            bash scripts/ci-check.sh "$bundle signature verification" codesign --verify --deep --strict "$bundle"
          done
      - name: Audio, MIDI, state and VST3 tests
        run: bash scripts/ci-check.sh 'Audio, MIDI, state and VST3 tests' build/SynthTests_artefacts/Release/SynthTests "$PWD/build/Sixth_artefacts/Release/VST3/Sixth.vst3"
      - name: Validate Audio Unit
        run: bash scripts/ci-check.sh 'Audio Unit validation' bash scripts/validate-au.sh build
      - name: Package plugins and standalone app
        run: bash scripts/ci-check.sh 'Package macOS installer' bash scripts/package-macos.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: Sixth-macOS
          if-no-files-found: error
          path: |
            build/Sixth-macOS.pkg
            build/Sixth-macOS.tar.gz
